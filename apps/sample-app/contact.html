<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Contact — Northbeam</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="nav">
      <a class="logo" href="/">Northbeam</a>
      <nav>
        <a href="/features.html">Features</a>
        <a href="/pricing.html">Pricing</a>
        <a href="/contact.html">Contact</a>
        <a class="cta" href="/signup.html">Start free trial</a>
      </nav>
    </header>
    <main class="page">
      <p class="kicker">Talk to the team</p>
      <h1>Book a walkthrough</h1>
      <p class="lede">Tell us who you are. We use this form to schedule a live product tour.</p>
      <form class="panel" action="#" method="get">
        <label>Work email <input type="email" name="email" placeholder="you@company.com" autocomplete="email" /></label>
        <label>Company name <input type="text" name="company" placeholder="Acme Inc" /></label>
        <label>
          Team size
          <select name="size">
            <option>1–10 people</option>
            <option>11–50 people</option>
            <option>51+ people</option>
          </select>
        </label>
        <label class="check-row">
          <input type="checkbox" name="tips" />
          Email me a sample report
        </label>
        <button type="button">Book a walkthrough</button>
      </form>
    </main>
  </body>
</html>
